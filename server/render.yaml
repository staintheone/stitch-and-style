services:
  - type: web
    name: stitch-and-style-api
    env: node
    region: ohio
    buildCommand: npm install && npm run build && npm run db:generate
    startCommand: npm run db:push && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stitch-and-style-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-vercel-project-name.vercel.app # TODO: Update this after deploying to Vercel

databases:
  - name: stitch-and-style-db
    databaseName: stitch_and_style
    user: stitch_user
    region: ohio
